<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Kotak Pesan</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-slate-100 p-8">

    <div class="mx-auto max-w-xl space-y-4">

        <h1 class="mb-6 text-2xl font-bold text-slate-900">
            Kotak Pesan
        </h1>

        <div class="rounded-lg border border-blue-300
                    bg-blue-100 p-4 text-blue-800">
            <h2 class="font-bold">Informasi</h2>
            <p class="mt-1 text-sm">
                Silakan periksa kembali data yang Anda masukkan.
            </p>
        </div>

        <div class="rounded-lg border border-green-300
                    bg-green-100 p-4 text-green-800">
            <h2 class="font-bold">Berhasil!</h2>
            <p class="mt-1 text-sm">
                Data berhasil disimpan ke dalam sistem.
            </p>
        </div>

        <div class="rounded-lg border border-yellow-300
                    bg-yellow-100 p-4 text-yellow-800">
            <h2 class="font-bold">Peringatan!</h2>
            <p class="mt-1 text-sm">
                Pastikan semua kolom sudah terisi.
            </p>
        </div>

        <div class="rounded-lg border border-red-300
                    bg-red-100 p-4 text-red-800">
            <h2 class="font-bold">Terjadi Kesalahan!</h2>
            <p class="mt-1 text-sm">
                Proses tidak dapat dilanjutkan.
            </p>
        </div>

    </div>

</body>
</html>
