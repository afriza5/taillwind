<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Profil Pribadi</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="flex min-h-screen items-center justify-center bg-slate-100 p-6">

    <article class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">

        <!-- Avatar -->
        <div class="mx-auto flex size-28 items-center justify-center
                    rounded-full bg-emerald-600 text-3xl font-bold text-white">
            AR
        </div>

        <!-- Nama -->
        <h1 class="mt-5 text-center text-2xl font-bold text-slate-900">
            Afriza Rizky Pratama
        </h1>

        <p class="text-center text-sm font-medium text-emerald-600">
            Mahasiswa Teknologi Informasi
        </p>

        <!-- Deskripsi -->
        <p class="mt-4 text-center text-slate-600">
            Saya adalah mahasiswa yang tertarik pada pengembangan
            website, teknologi, dan desain antarmuka.
        </p>

        <!-- Keahlian -->
        <div class="mt-5 flex flex-wrap justify-center gap-2">

            <span class="rounded-full bg-emerald-100 px-3 py-2
                         text-xs font-semibold text-emerald-700">
                HTML
            </span>

            <span class="rounded-full bg-emerald-100 px-3 py-2
                         text-xs font-semibold text-emerald-700">
                CSS
            </span>

            <span class="rounded-full bg-emerald-100 px-3 py-2
                         text-xs font-semibold text-emerald-700">
                JavaScript
            </span>

            <span class="rounded-full bg-emerald-100 px-3 py-2
                         text-xs font-semibold text-emerald-700">
                Tailwind CSS
            </span>

        </div>

        <!-- Tombol -->
        <button class="mt-7 w-full rounded-lg bg-emerald-600 py-3
                       font-semibold text-white">
            Hubungi Saya
        </button>

    </article>

</body>
</html>
